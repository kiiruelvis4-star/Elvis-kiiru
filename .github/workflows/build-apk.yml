name: Build Android APK (Zip)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Zip Evening Milk APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build offline web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package APK into Zip
        run: |
          mkdir -p release-zip
          cp android/app/build/outputs/apk/debug/app-debug.apk release-zip/Evening-Milk.apk
          zip -j evening-milk-apk.zip release-zip/Evening-Milk.apk
          ls -lh evening-milk-apk.zip

      - name: Upload APK Zip as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: evening-milk-apk
          path: evening-milk-apk.zip
          retention-days: 90

      - name: Publish Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-apk' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Evening Milk — Latest Offline APK' }}
          body: |
            Download **evening-milk-apk.zip**, unzip it on your Android phone, and tap **Evening-Milk.apk** to install.
            - Works 100% offline with zero data or Wi-Fi
            - Daily 4:00 PM offline reminder notifications
          files: evening-milk-apk.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
